<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectroHub Admin</title>
  <style>
    body { font-family: sans-serif; background: #e3f5e9; padding: 2rem; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.1); }
    label { display: block; margin: 1rem 0 0.3rem; font-weight: bold; }
    input, select { width: 100%; padding: 0.7rem; border: 2px solid #c8e6c9; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 1rem; background: #2e7d32; color: white; padding: 0.8rem 2rem; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛠️ ElectroHub Admin</h1>
    <p>Add a new product to the store.</p>

    <form id="productForm">
      <label>Name *</label>
      <input type="text" id="name" required />

      <label>Category *</label>
      <select id="category" required>
        <option value="Smartphone">Smartphone</option>
        <option value="Laptop">Laptop</option>
        <option value="Headphone">Headphone</option>
        <option value="Tablet">Tablet</option>
        <option value="Camera">Camera</option>
        <option value="Accessory">Accessory</option>
      </select>

      <label>Price (KES) *</label>
      <input type="number" id="priceKES" required />

      <label>Image URL *</label>
      <input type="text" id="image" placeholder="https://..." required />

      <label>Icon (Font Awesome class)</label>
      <input type="text" id="icon" value="fa-box" />

      <label>Rating (0.0 – 5.0)</label>
      <input type="number" id="rating" step="0.1" min="0" max="5" value="4.5" />

      <label>Supplier (optional)</label>
      <input type="text" id="supplier" />

      <button type="submit">Add Product</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('productForm');
    const status = document.getElementById('status');

    // Find admin secret from URL parameter (better than hardcoding)
    const urlParams = new URLSearchParams(window.location.search);
    const adminKey = urlParams.get('key') || prompt('Enter admin key:');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        priceKES: parseInt(document.getElementById('priceKES').value),
        image: document.getElementById('image').value,
        icon: document.getElementById('icon').value,
        rating: parseFloat(document.getElementById('rating').value),
        supplier: document.getElementById('supplier').value
      };

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': adminKey
          },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          status.innerHTML = '<p style="color:green;">✅ Product added successfully!</p>';
          form.reset();
        } else {
          status.innerHTML = `<p style="color:red;">❌ ${result.error || 'Failed'}</p>`;
        }
      } catch (err) {
        status.innerHTML = `<p style="color:red;">❌ Network error</p>`;
      }
    });
  </script>
</body>
</html>
